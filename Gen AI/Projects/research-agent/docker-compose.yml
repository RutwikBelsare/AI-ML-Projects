
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: research-agent-memory-db

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: langgraph_memory

    ports:
      - "5433:5432"

    volumes:
      - postgres_memory_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d langgraph_memory
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_memory_data:
